[project]
name = "brainlearn-workspace"
version = "0.1.0"
description = "Local-first visual workflows for reproducible neuroscience research"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "brainlearn-core",
  "brainlearn-server",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
docs = [
  "myst-parser==4.0.1",
  "pydata-sphinx-theme==0.23.0",
  "sphinx==8.2.3",
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.6.1",
  "sphinx-gallery==0.22.1",
]
eeg = [
  "brainlearn-mne",
  "mne==1.13.2",
  "mne-bids==0.20.0",
]

[tool.uv.sources]
brainlearn-core = { workspace = true }
brainlearn-server = { workspace = true }
brainlearn-mne = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/server", "plugins/mne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["brainlearn_core", "brainlearn_server", "brainlearn_mne"]
mypy_path = ["packages/core/src", "packages/server/src", "plugins/mne/src"]
