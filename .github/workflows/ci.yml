name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: uv sync --locked --all-packages --group eeg

      - name: Verify GitHub Actions pins and permissions
        run: uv run --frozen python scripts/check_action_security.py

      - name: Lint Python
        run: uv run --frozen ruff check .

      - name: Check Python formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check Python
        run: uv run --frozen mypy packages/core/src packages/server/src

      - name: Test Python
        run: uv run --frozen pytest -q

  schema-compatibility:
    name: Persisted schema compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: uv sync --locked --all-packages --group eeg

      - name: Test persisted schema migrations and round trips
        run: >-
          uv run --locked pytest -q
          tests/test_schema.py
          tests/test_projects.py
          tests/test_execution_contracts.py
          tests/test_run_store.py
          tests/test_datasets.py
          tests/test_dataset_downloads.py
          tests/test_download_records.py
          tests/test_cohort.py
          tests/test_presentation.py
          tests/test_researcher_decisions.py

  generated-code-integration:
    name: Generated EEG code integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: uv sync --locked --all-packages --group eeg

      - name: Execute generated EEG workflows on the synthetic BIDS fixture
        run: >-
          uv run --locked pytest -q
          tests/test_eeg_filter.py::test_adapter_direct_mne_and_generated_script_agree_and_preserve_source
          tests/test_eeg_ica.py::test_ica_pauses_persists_review_and_matches_direct_mne_and_export
          tests/test_cohort_api.py::test_exported_direct_mne_replay_matches_separate_synthetic_reference

  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  platform-smoke:
    name: Clean install smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-24.04
          - platform: macOS Apple Silicon
            os: macos-15
          - platform: Windows x86-64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python workspace and EEG dependencies
        run: uv sync --locked --all-packages --group eeg

      - name: Smoke-test local API and cohort CLI
        run: |
          uv run --locked pytest -q tests/test_api.py tests/test_cohort_cli.py
          uv run --locked brainlearn-cohort --help

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/web

      - name: Smoke-build frontend
        run: npm --prefix apps/web run build
