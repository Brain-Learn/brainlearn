name: Dataset Smoke

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Pinned OpenNeuro integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: uv sync --locked --all-packages

      - name: Run pinned integration smoke
        run: uv run python -m brainlearn_server.integration_smoke --log-file diagnostic-drift.json
        env:
          BRAINLEARN_INTEGRATION_SMOKE: "1"

      - name: Upload diagnostic drift log on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dataset-drift-diagnostic
          path: diagnostic-drift.json
          if-no-files-found: ignore
