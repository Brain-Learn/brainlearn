<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 304" role="img" aria-labelledby="title desc">
  <title id="title">BrainLearn EEG workflow maturity map</title>
  <desc id="desc">The experimental executable path reads BIDS EEG, inspects the signal, and filters it. ICA review is under scientific review. Epochs, ERP, PSD, and reporting are planned.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#79909d"/></marker>
  </defs>
  <rect width="1120" height="304" rx="22" fill="#f5f8f8"/>
  <text x="40" y="42" fill="#586d7a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">EEG WORKFLOW · CURRENT MATURITY</text>
  <text x="40" y="70" fill="#162b3a" font-family="Georgia,serif" font-size="21">One working path, with the next scientific gates visible</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="112" width="168" height="86" rx="12" fill="#162b3a"/>
    <text x="124" y="147" fill="#fff" font-size="17" font-weight="700">BIDS EEG</text>
    <text x="124" y="171" fill="#bad4dc" font-size="12">local dataset</text>
    <path d="M211 155h34" stroke="#79909d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="252" y="112" width="168" height="86" rx="12" fill="#162b3a"/>
    <text x="336" y="147" fill="#fff" font-size="17" font-weight="700">Inspect</text>
    <text x="336" y="171" fill="#bad4dc" font-size="12">metadata + signal</text>
    <path d="M423 155h34" stroke="#79909d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="464" y="112" width="168" height="86" rx="12" fill="#007b80"/>
    <text x="548" y="147" fill="#fff" font-size="17" font-weight="700">MNE filter</text>
    <text x="548" y="171" fill="#d4f4f0" font-size="12">preview + export</text>
    <path d="M635 155h34" stroke="#79909d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="676" y="112" width="168" height="86" rx="12" fill="#fff4e8" stroke="#cf7a38" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="760" y="147" fill="#793a16" font-size="17" font-weight="700">ICA review</text>
    <text x="760" y="171" fill="#945d3e" font-size="12">methods review pending</text>
    <path d="M847 155h34" stroke="#aab8bf" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="888" y="112" width="192" height="86" rx="12" fill="#fff" stroke="#aab8bf" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="984" y="147" fill="#586d7a" font-size="17" font-weight="700">Epochs → ERP / PSD</text>
    <text x="984" y="171" fill="#748994" font-size="12">reporting planned</text>
    <rect x="40" y="226" width="18" height="18" rx="4" fill="#162b3a"/>
    <text x="68" y="240" text-anchor="start" fill="#586d7a" font-size="13">implemented path · experimental</text>
    <rect x="336" y="226" width="18" height="18" rx="4" fill="#fff4e8" stroke="#cf7a38" stroke-width="2"/>
    <text x="364" y="240" text-anchor="start" fill="#586d7a" font-size="13">engineering work · independent methods review pending</text>
    <rect x="744" y="226" width="18" height="18" rx="4" fill="#fff" stroke="#aab8bf" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="772" y="240" text-anchor="start" fill="#586d7a" font-size="13">planned executable work</text>
  </g>
</svg>
